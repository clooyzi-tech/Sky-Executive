<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D3B1" />
      <stop offset="50%" stop-color="#C69235" />
      <stop offset="100%" stop-color="#A17524" />
    </linearGradient>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3959" />
      <stop offset="100%" stop-color="#0B2D46" />
    </linearGradient>
  </defs>

  <!-- Outer Navy Disc -->
  <circle cx="150" cy="150" r="142" fill="url(#bgNavy)" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Inner Decorative Gold Ring -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="#C69235" stroke-width="1.2" stroke-dasharray="3, 3" opacity="0.6" />
  <circle cx="150" cy="150" r="122" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Architectural Sky Crest / Crown -->
  <path d="M120 85 L150 62 L180 85 L170 95 L150 80 L130 95 Z" fill="url(#goldGrad)" />
  
  <!-- Monogram S E -->
  <g id="monogram" fill="url(#goldGrad)">
    <!-- Stylized S -->
    <path d="M125 110 C140 110 148 116 148 126 C148 136 138 141 126 144 C112 147 105 153 105 163 C105 176 117 184 135 184 C145 184 153 181 157 178 L154 167 C149 170 142 173 134 173 C124 173 118 168 118 162 C118 154 126 150 138 147 C152 144 160 137 160 126 C160 113 148 100 126 100 C116 100 108 103 103 106 L107 117 C112 113 118 110 125 110 Z" />
    <!-- Stylized E -->
    <path d="M165 102 L198 102 L198 113 L178 113 L178 137 L194 137 L194 147 L178 147 L178 172 L199 172 L199 183 L165 183 Z" />
  </g>

  <!-- Horizontal divider wings -->
  <line x1="65" y1="198" x2="115" y2="198" stroke="url(#goldGrad)" stroke-width="1.5" />
  <polygon points="150,195 153,198 150,201 147,198" fill="url(#goldGrad)" />
  <line x1="185" y1="198" x2="235" y2="198" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Brand Typography -->
  <text x="150" y="222" font-family="'Cinzel', 'Playfair Display', serif" font-size="17" font-weight="700" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle">
    SKY EXECUTIVE
  </text>
  <text x="150" y="242" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="6" fill="#E5D3B1" text-anchor="middle" opacity="0.9">
    HOTEL • PUNE
  </text>
  
  <!-- Subtle stars -->
  <polygon points="80,148 82,152 87,152 83,155 85,159 80,156 75,159 77,155 73,152 78,152" fill="#E5D3B1" opacity="0.7" />
  <polygon points="220,148 222,152 227,152 223,155 225,159 220,156 215,159 217,155 213,152 218,152" fill="#E5D3B1" opacity="0.7" />
</svg>
